# =============================================================================
# OpsHub \u5E94\u7528\u4E3B\u914D\u7F6E\uFF08\u7F16\u7801\u89C4\u8303 \u00A71 \u591A\u73AF\u5883\u914D\u7F6E\u5206\u6587\u4EF6\u7BA1\u7406 / \u00A72.7.1 \u73AF\u5883\u914D\u7F6E\uFF09
# \u672C\u6587\u4EF6\u53EA\u767B\u8BB0\u4E0E\u8FD0\u884C\u73AF\u5883\u65E0\u5173\u7684\u9759\u6001\u914D\u7F6E\uFF1B\u73AF\u5883\u76F8\u5173\u914D\u7F6E\u89C1 config/app-{dev,test,prod}.properties
# =============================================================================

# ---------------------------- \u5E94\u7528\u6807\u8BC6 ----------------------------
spring.application.name=opshub
# \u9ED8\u8BA4\u6FC0\u6D3B\u73AF\u5883\uFF0C\u53EF\u88AB\u542F\u52A8\u53C2\u6570 --spring.profiles.active=xxx \u6216\u73AF\u5883\u53D8\u91CF SPRING_PROFILES_ACTIVE \u8986\u76D6
spring.profiles.active=dev

# \u73AF\u5883\u9759\u6001\u914D\u7F6E\u5206\u6587\u4EF6\u5BFC\u5165\uFF1A\u5404\u6587\u4EF6\u5185\u7528 spring.config.activate.on-profile \u58F0\u660E\u751F\u6548\u73AF\u5883\uFF0C\u4E92\u4E0D\u5F71\u54CD
spring.config.import=\
  classpath:config/app-dev.properties,\
  classpath:config/app-test.properties,\
  classpath:config/app-prod.properties

# ---------------------------- \u88C5\u914D\u7B56\u7565 ----------------------------
# \u5173\u95ED\u6846\u67B6\u9ED8\u8BA4\u6570\u636E\u6E90\u81EA\u52A8\u88C5\u914D\uFF08\u7F16\u7801\u89C4\u8303 \u00A72.7.1\uFF09\uFF1A\u6570\u636E\u6E90\u3001\u4E8B\u52A1\u6A21\u677F\u7EDF\u4E00\u7531 classpath:spring/datasource.xml \u81EA\u5B9A\u4E49\u88C5\u914D
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ---------------------------- Web \u5BB9\u5668 ----------------------------
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true

# ---------------------------- \u65E5\u5FD7 ----------------------------
# \u65E5\u5FD7\u683C\u5F0F\u3001\u6EDA\u52A8\u7B56\u7565\u3001\u5F02\u6B65\u4E0E\u5206\u7EA7\u8F93\u51FA\u7EDF\u4E00\u5728 logback-spring.xml \u4E2D\u5B9A\u4E49\uFF0C\u6B64\u5904\u4EC5\u63D0\u4F9B\u65E5\u5FD7\u6839\u8DEF\u5F84
logging.file.path=logs

# ---------------------------- \u76D1\u63A7\u7AEF\u70B9 ----------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true

# ---------------------------- MyBatis-Flex \u901A\u7528\u9879 ----------------------------
# Mapper XML \u626B\u63CF\u8DEF\u5F84\uFF08\u4E0E infra-dal \u6A21\u5757 resources \u76EE\u5F55\u7EA6\u5B9A\u4E00\u81F4\uFF09
mybatis-flex.mapper-locations=classpath*:/sqlmap/**/*.xml
# \u9A7C\u5CF0\u6620\u5C04\uFF1A\u6570\u636E\u5E93\u4E0B\u5212\u7EBF\u5B57\u6BB5\u81EA\u52A8\u6620\u5C04\u5230 Java \u9A7C\u5CF0\u5C5E\u6027
mybatis-flex.configuration.map-underscore-to-camel-case=true
# \u5173\u95ED\u4E8C\u7EA7\u7F13\u5B58\uFF0C\u907F\u514D\u5206\u5E03\u5F0F\u73AF\u5883\u4E0B\u591A\u8282\u70B9\u7F13\u5B58\u4E0D\u4E00\u81F4
mybatis-flex.configuration.cache-enabled=false
# SQL \u65E5\u5FD7\u8D70 SLF4J\uFF0C\u7531 logback \u7EDF\u4E00\u63A7\u5236\u7EA7\u522B
mybatis-flex.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
# \u5173\u95ED\u542F\u52A8 banner\uFF0C\u907F\u514D\u6C61\u67D3\u6807\u51C6\u8F93\u51FA
mybatis-flex.global-config.print-banner=false
# \u4E3B\u952E\u7B56\u7565\uFF1AKeyType.Generator \u5BF9\u5E94\u6570\u636E\u5E93\u81EA\u589E\uFF08\u53EF\u9009 Auto / Sequence / Generator / None\uFF09
mybatis-flex.global-config.key-config.key-type=Generator
# \u903B\u8F91\u5220\u9664\u7EDF\u4E00\u7EA6\u5B9A\uFF08\u4EC5\u767B\u8BB0\u5217\u540D\uFF0C\u5177\u4F53\u5B9E\u4F53\u6309\u9700\u5728 @Column \u4E0A\u8986\u76D6\uFF09
mybatis-flex.global-config.logic-delete-column=deleted
mybatis-flex.global-config.normal-value-of-logic-delete=0
mybatis-flex.global-config.deleted-value-of-logic-delete=1
# Mandatory bootstrap account; no default password. Supply a BCrypt hash.
opshub.security.admin.username=${OPSHUB_ADMIN_USERNAME}
opshub.security.admin.password-hash=${OPSHUB_ADMIN_PASSWORD_HASH}
