# OpsHub \u6D4B\u8BD5\u73AF\u5883\u9759\u6001\u914D\u7F6E\uFF08\u7F16\u7801\u89C4\u8303 \u00A71\uFF1A\u591A\u73AF\u5883\u914D\u7F6E\u5206\u6587\u4EF6\u7BA1\u7406\uFF1B\u00A72.7.1 \u73AF\u5883\u914D\u7F6E\uFF09
# \u672C\u6587\u4EF6\u4EC5\u5728 test \u73AF\u5883\u6FC0\u6D3B\uFF0C\u672A\u6FC0\u6D3B\u65F6\u5176\u5168\u90E8\u5C5E\u6027\u4E0D\u53C2\u4E0E\u88C5\u914D\u3002
spring.config.activate.on-profile=test

# ---------------------------- \u6570\u636E\u6E90\uFF08\u6D4B\u8BD5\u5E93\uFF09 ----------------------------
opshub.datasource.jdbc-url=jdbc:mysql://127.0.0.1:3306/opshub_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
opshub.datasource.username=root
opshub.datasource.password=root
opshub.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u8FDE\u63A5\u6C60\uFF08HikariCP\uFF09\u53C2\u6570
opshub.datasource.hikari.minimum-idle=5
opshub.datasource.hikari.maximum-pool-size=30
opshub.datasource.hikari.connection-timeout=30000
opshub.datasource.hikari.idle-timeout=600000
opshub.datasource.hikari.max-lifetime=1800000
opshub.datasource.hikari.pool-name=OpsHubHikariPool-test

# ---------------------------- \u65E5\u5FD7\u7EA7\u522B\uFF08\u6D4B\u8BD5\uFF1A\u9002\u4E2D\uFF09 ----------------------------
logging.level.root=INFO
logging.level.com.nianliu.opshub=INFO
logging.level.org.springframework=WARN
logging.level.org.mybatis=WARN
logging.level.com.mybatis.flex=WARN

# ---------------------------- \u6D4B\u8BD5\u671F\u5F00\u5173 ----------------------------
opshub.web.xss.enabled=false
opshub.monitor.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
