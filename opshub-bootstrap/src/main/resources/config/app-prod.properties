# OpsHub \u751F\u4EA7\u73AF\u5883\u9759\u6001\u914D\u7F6E\uFF08\u7F16\u7801\u89C4\u8303 \u00A71\uFF1A\u591A\u73AF\u5883\u914D\u7F6E\u5206\u6587\u4EF6\u7BA1\u7406\uFF1B\u00A72.7.1 \u73AF\u5883\u914D\u7F6E\uFF09
# \u672C\u6587\u4EF6\u4EC5\u5728 prod / preview \u73AF\u5883\u6FC0\u6D3B\uFF0C\u672A\u6FC0\u6D3B\u65F6\u5176\u5168\u90E8\u5C5E\u6027\u4E0D\u53C2\u4E0E\u88C5\u914D\u3002
spring.config.activate.on-profile=prod,preview
# \u5BC6\u7801\u7C7B\u654F\u611F\u914D\u7F6E\u4E0D\u5199\u6B7B\u5728\u6587\u4EF6\uFF1A\u901A\u8FC7\u73AF\u5883\u53D8\u91CF / \u914D\u7F6E\u4E2D\u5FC3\u6CE8\u5165\uFF0C\u5360\u4F4D\u8BED\u6CD5 ${OPSHUB_DB_PASSWORD}\u3002

# ---------------------------- \u6570\u636E\u6E90\uFF08\u751F\u4EA7\u5E93\uFF09 ----------------------------
opshub.datasource.jdbc-url=${OPSHUB_DB_URL}
opshub.datasource.username=${OPSHUB_DB_USERNAME}
opshub.datasource.password=${OPSHUB_DB_PASSWORD}
opshub.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u8FDE\u63A5\u6C60\uFF08HikariCP\uFF09\u53C2\u6570\uFF1A\u751F\u4EA7\u671F\u5BB9\u91CF\u66F4\u5927\u3001\u63A2\u6D4B\u66F4\u4E25\u8C28
opshub.datasource.hikari.minimum-idle=10
opshub.datasource.hikari.maximum-pool-size=50
opshub.datasource.hikari.connection-timeout=10000
opshub.datasource.hikari.idle-timeout=600000
opshub.datasource.hikari.max-lifetime=1200000
opshub.datasource.hikari.pool-name=OpsHubHikariPool-prod

# ---------------------------- \u65E5\u5FD7\u7EA7\u522B\uFF08\u751F\u4EA7\uFF1A\u7CBE\u7B80\uFF09 ----------------------------
logging.level.root=WARN
logging.level.com.nianliu.opshub=INFO
logging.level.org.springframework=WARN
logging.level.org.mybatis=WARN
logging.level.com.mybatis.flex=WARN

# ---------------------------- \u751F\u4EA7\u671F\u5F00\u5173 ----------------------------
# \u751F\u4EA7\u5FC5\u987B\u5F00\u542F XSS \u9632\u62A4
opshub.web.xss.enabled=true
opshub.monitor.enabled=true
# \u751F\u4EA7\u5173\u95ED SQL \u6253\u5370\u4E0E banner\uFF0C\u907F\u514D\u654F\u611F\u6570\u636E\u6CC4\u9732
mybatis-flex.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl